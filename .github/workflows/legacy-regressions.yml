name: Historical ParseHub patch replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.7
      - run: uv sync --locked
      - name: Replay historical patches separately from release validation
        run: |
          git clone --bare https://github.com/z-mio/ParseHub.git .cache/upstream-baseline
          $candidateSha = uv run --no-sync python -c "from media_downloader import UPSTREAM_SHA; print(UPSTREAM_SHA)"
          uv run --no-sync python scripts/sync_upstream.py --source .cache/upstream-baseline --sha $candidateSha --report review/ci-patch-replay.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: historical-patch-replay
          path: review/ci-patch-replay.json
