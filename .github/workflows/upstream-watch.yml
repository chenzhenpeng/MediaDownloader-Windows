name: Prepare ParseHub update candidate
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parsehub-upstream-watch
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # Install only the reviewed default-branch environment BEFORE replacing vendor source.
      - run: python -m pip install uv==0.10.7
      - run: uv sync --locked
      - name: Prepare candidate; never build or import upstream code in this write-token job
        run: uv run --no-sync python scripts/sync_upstream.py --apply
      - name: Create a deduplicated draft PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $report = Get-Content review/upstream-candidate.json -Raw | ConvertFrom-Json
          if (-not $report.changed -or -not $report.ready) { exit 0 }
          $branchName = 'automation/parsehub-' + $report.candidate_sha.Substring(0, 12)
          $existingBranch = git ls-remote --heads origin "refs/heads/$branchName"
          if ($existingBranch) { exit 0 }
          git switch -c $branchName
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream-ParseHub src/media_downloader/__init__.py review/upstream-candidate.json
          git commit -m "Prepare reviewed patch replay for ParseHub candidate"
          git push origin $branchName
          $body = "Candidate SHA: $($report.candidate_sha)`n`nPinned patches applied. Refresh uv.lock if metadata changed. Run Windows contracts, frozen build and live platform samples before merging or signing. Dependency change: $($report.dependencies_changed). No automatic release."
          New-Item -ItemType Directory -Force .local | Out-Null
          Set-Content -LiteralPath .local/upstream-pr.md -Value $body -Encoding utf8
          gh pr create --draft --head $branchName --title "ParseHub candidate $($report.candidate_sha.Substring(0, 12))" --body-file .local/upstream-pr.md
          gh workflow run validate.yml --ref $branchName
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: upstream-candidate-report
          path: review/upstream-candidate.json
