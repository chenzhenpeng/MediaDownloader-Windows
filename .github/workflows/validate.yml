name: Windows validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.7
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests scripts packaging
      # Hosted runners have no interactive desktop; keyboard focus is checked locally.
      - run: uv run --no-sync pytest tests upstream-ParseHub/test -q --tb=short -k "not test_ui_keyboard_themes_and_responsive_layout"
      - name: Replay reviewed patches without executing candidate source
        shell: pwsh
        run: |
          git clone --bare https://github.com/z-mio/ParseHub.git .cache/upstream-baseline
          $candidateSha = uv run --no-sync python -c "from media_downloader import UPSTREAM_SHA; print(UPSTREAM_SHA)"
          uv run --no-sync python scripts/sync_upstream.py --source .cache/upstream-baseline --sha $candidateSha --report review/ci-patch-replay.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: validation-evidence
          path: review/ci-patch-replay.json
