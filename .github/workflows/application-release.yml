name: Build Windows application package draft
on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Accepted signed execution runtime to bundle
        required: true
        type: string
        default: '0.1.5'
permissions:
  contents: read
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    environment: engine-release
    permissions:
      contents: write
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.403'
      - run: python -m pip install uv==0.10.7
      - run: uv sync --locked
      - name: Fetch accepted execution runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          gh release download "engine-$env:RUNTIME_VERSION" --pattern release.json --pattern release.sig --pattern engine.zip --dir build/runtime-feed
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
      - run: uv run --no-sync python scripts/materialize_runtime.py build/runtime-feed --output dist/ci/media-engine
      - run: dotnet restore native/MediaDownloader/MediaDownloader.csproj --locked-mode -p:Platform=x64 --packages .cache/nuget/packages
      - run: uv run --no-sync python scripts/build_native.py --engine-dir dist/ci/media-engine
      - run: uv run --no-sync python scripts/fetch_installer_toolchain.py
      - run: uv run --no-sync python scripts/build_installer.py
      - run: uv run --no-sync python scripts/build_installer.py --qa
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: application-package-for-desktop-acceptance
          path: |
            dist/release/*Setup.exe
            dist/release/release.json
            dist/release/qa-release.json
            dist/release/*payload.json
            dist/release/SHA256SUMS.txt
      - name: Create reviewable application draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Get-Content dist/release/release.json -Raw | ConvertFrom-Json
          Set-Content build/app-release-notes.md 'Native x64 application package. Complete isolated desktop installation, repair, uninstall and UI acceptance before publication. Runtime and parser updates use the signed component channel.'
          gh release create "client-$($release.release)" "dist/release/$($release.installer)" dist/release/SHA256SUMS.txt --target $env:GITHUB_SHA --draft --latest=false --title "Media Downloader $($release.release)" --notes-file build/app-release-notes.md
