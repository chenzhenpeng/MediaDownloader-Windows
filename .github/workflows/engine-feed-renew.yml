name: Renew signed engine discovery metadata
on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-release
  cancel-in-progress: false
jobs:
  renew:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-latest
    environment: engine-release
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.10.7
      - run: uv sync --locked
      - name: Fetch current published engine metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to find current engine release' }
          if ($release.tag_name -notmatch '^engine-[A-Za-z0-9][A-Za-z0-9._-]{0,47}$') { throw 'Latest must be an engine release' }
          $release.tag_name | Set-Content build-tag.txt
          gh release download $release.tag_name --pattern release.json --pattern release.sig --dir build/feed
          if ($LASTEXITCODE -ne 0) { throw 'Metadata download failed' }
      - name: Verify existing signature and renew expiry and sequence only
        env:
          ENGINE_SIGNING_KEY_PEM: ${{ secrets.ENGINE_SIGNING_KEY_PEM }}
        run: uv run --no-sync python scripts/renew_engine_feed.py build/feed
      - name: Publish renewed signed discovery pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content build-tag.txt).Trim()
          gh release upload $tag build/feed/release.json build/feed/release.sig --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Signed metadata upload failed' }
