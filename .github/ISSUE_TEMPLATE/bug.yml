name: 问题反馈
description: 解析、下载、安装或界面问题
body:
  - type: markdown
    attributes:
      value: 请勿提交 Cookie、Token、私密链接或未脱敏日志。
  - type: input
    id: version
    attributes:
      label: 应用和组件版本
      description: 在设置中查看应用、ParseHub、Worker 等版本。
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows 版本
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: 平台及公开作品链接
      description: 安装或界面问题可留空，勿填写私密链接。
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤和实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
  - type: textarea
    id: evidence
    attributes:
      label: 错误码、脱敏日志或截图
      description: 上传前删除凭据及个人路径。
